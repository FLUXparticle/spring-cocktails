<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bar-Werkstatt</title>
</head>

<body>

<h1>Bearbeitungskonflikt</h1>
<p role="alert" th:text="${message}">
</p>
<p>Deine Eingaben bleiben erhalten. Übernimm bei Bedarf einzelne aktuelle Werte oder bearbeite deine Eingaben und speichere erneut. Ein weiterer Konflikt wird wieder erkannt.</p>
<form method="post" th:action="@{/bars/{id}(id=${barId})}" th:object="${form}">
<input type="hidden" th:field="*{version}">
<p>Vergleich mit Datenbankversion <strong th:text="${@barVersions.get(databaseBar)}">
</strong>
</p>
<table>
<thead>
<tr>
<th>Feld</th>
<th>Deine Eingabe</th>
<th>Übernehmen</th>
<th>Aktueller Datenbankwert</th>
</tr>
</thead>
<tbody>
<tr>
<th>
<label for="name">Name</label>
</th>
<td>
<input th:field="*{name}" required maxlength="20">
</td>
<td>
<button type="button" aria-label="Name aus der Datenbank übernehmen" data-adopt="name" th:attr="data-value=${databaseBar.name}">←</button>
</td>
<td th:text="${databaseBar.name}">
</td>
</tr>
<tr>
<th>
<label for="email">E-Mail</label>
</th>
<td>
<input type="email" th:field="*{email}" required>
</td>
<td>
<button type="button" aria-label="E-Mail aus der Datenbank übernehmen" data-adopt="email" th:attr="data-value=${databaseBar.email}">←</button>
</td>
<td th:text="${databaseBar.email}">
</td>
</tr>
<tr>
<th>
<label for="address">Adresse</label>
</th>
<td>
<input th:field="*{address}" maxlength="20">
</td>
<td>
<button type="button" aria-label="Adresse aus der Datenbank übernehmen" data-adopt="address" th:attr="data-value=${databaseBar.address}">←</button>
</td>
<td th:text="${databaseBar.address}">
</td>
</tr>
</tbody>
</table>
<button>Zusammengeführte Version speichern</button> <button type="button" id="adopt-all">Alle Datenbankwerte übernehmen</button> <a th:href="@{/bars}">Abbrechen</a>
</form>
<script defer th:src="@{/bar-merge.js}">
</script>

</body>
</html>
