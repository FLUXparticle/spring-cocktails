<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bar-Werkstatt</title>
</head>

<body>

<h1>Bars</h1>
<p>Bars verwalten, Daten abfragen und gleichzeitige Änderungen untersuchen.</p>
<p th:if="${message}" th:text="${message}" role="status">
</p>
<a th:href="@{/bars/new}">Neue Bar</a>
<form method="get" th:action="@{/bars}">
<label>Suche <input name="search" th:value="${search}">
</label>
<button>Suchen</button>
</form>
<p>
<strong th:text="${#lists.size(bars)}">
</strong> Treffer
</p>
<table>
<thead>
<tr>
<th>ID</th>
<th>Version</th>
<th>Name</th>
<th>E-Mail</th>
<th>Adresse</th>
<th>Aktionen</th>
</tr>
</thead>
<tbody>
<tr th:each="bar : ${bars}">

<td th:text="${bar.id}">
</td>
<td th:text="${@barVersions.get(bar)}">
</td>
<td th:text="${bar.name}">
</td>
<td th:text="${bar.email}">
</td>
<td th:text="${bar.address}">
</td>
<td>
<a th:href="@{/bars/{id}/edit(id=${bar.id})}">Bearbeiten</a> · <a th:href="@{/bars/{id}/history(id=${bar.id})}">Historie</a>
</td>
</tr>
</tbody>
</table>

</body>
</html>
