# Alle Übungsdaten liegen ausschließlich im Arbeitsspeicher.
bars.datasource.url=jdbc:h2:mem:bars;DB_CLOSE_DELAY=-1
bars.seed=true

# Vorgegebene asynchrone E-Mail-Simulation für die Bar-Umgebung.
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=100
